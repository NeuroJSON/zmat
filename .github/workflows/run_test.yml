name: ZMat CI

on: [push, pull_request]

jobs:
  octave_test:
    name: Octave tests
    strategy:
      # tested octave versions: ubuntu-22.04 = 5.2, ubuntu-22.04 = 6.4, macos-13 = 8.1, windows-2022 = 8.3
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-15-intel, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          submodules: 'recursive'
      - name: Install dependencies
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update && (sudo apt-get install -y liboctave-dev valgrind || sudo apt-get install -y octave-dev valgrind)
          fi
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install octave
            brew install gcc@12
          fi
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            curl --retry 3 -kL http://cdimage.debian.org/mirror/gnu.org/gnu/octave/windows/octave-10.3.0-w64-64.7z --output octave_10.3.0.7z
            7z x octave_10.3.0.7z -ooctave -y
            echo 'C:\msys64\mingw64\bin' >> $GITHUB_PATH
            echo "$PWD/octave/octave-10.3.0-w64-64/mingw64/bin" >> $GITHUB_PATH
          fi
      - name: Build static library
        run: |
          which gcc
          which g++
          make -C src lib CC=gcc CXX=g++
          make -C example/c all CC=gcc CXX=g++ LIBTYPE=
          if [ "$RUNNER_OS" == "macOS" ]; then
             DYLD_LIBRARY_PATH=lib example/c/testzmat;
          else
             LD_LIBRARY_PATH=lib example/c/testzmat;
          fi
          octave-cli --eval "fprintf(1,['OCTAVE_ARCH=' regexprep(computer('arch'), 'darwin[0-9.]+-', 'darwin-')])"
          octave-cli --eval "fprintf(1,['OCTAVE_ARCH=' regexprep(computer('arch'), 'darwin[0-9.]+-', 'darwin-')])" >> $GITHUB_ENV
      - name: Build dynamic library
        run: |
          make -C src dll CC=gcc CXX=g++
          make -C example/c all  CC=gcc CXX=g++ LIBTYPE=
          if [ "$RUNNER_OS" == "macOS" ]; then
             DYLD_LIBRARY_PATH=lib example/c/testzmat;
          else
             LD_LIBRARY_PATH=lib example/c/testzmat;
          fi
      - name: Build octave mex (Windows only)
        if: ${{ runner.os == 'Windows' }}
        run: |
          # use the gcc bundled with Octave, matching its MinGW headers; a rolling MSYS2
          # gcc (16 and newer) clashes with them
          OCT="$PWD/octave/octave-10.3.0-w64-64/mingw64"
          export PATH="$OCT/bin:$PATH"
          which gcc && gcc --version | head -1
          # winpthread statically when Octave ships its static library, otherwise its DLL
          # goes into the package next to the mex
          PTHREAD=""
          [[ -f "$OCT/lib/libwinpthread.a" ]] && PTHREAD="-Wl,-Bstatic -lwinpthread -Wl,-Bdynamic"
          # Octave 10's mkoctfile links the mex against the stable liboctmex alone, so
          # it loads in any Octave 10 or newer; no liboctinterp, which ties it to 10.3
          make -C src oct CC=gcc CXX=g++ USERLINKOPT="-static-libgcc -static-libstdc++ -fstack-protector $PTHREAD -v -s"
          objdump -p zipmat.mex | grep "DLL Name:"
          if objdump -p zipmat.mex | grep -iE "DLL Name: *(liboctinterp|liboctave)"; then
              echo "the mex links an Octave library other than liboctmex"; exit 1
          fi
          if objdump -p zipmat.mex | grep -qi "DLL Name: *libwinpthread-1.dll"; then
              cp "$OCT/bin/libwinpthread-1.dll" .
          fi
          strip zipmat.mex
      - name: Build octave mex (Linux and Mac)
        if: ${{ runner.os != 'Windows' }}
        run: |
          gcc -v
          if [ "$RUNNER_OS" == "macOS" ]; then
              # link the mex without a path to liboctmex: -loctmex finds this empty stub, which is
              # dead-stripped, so the mex API resolves in the liboctmex that the running Octave (any
              # 10+ version, wherever installed) has loaded (mkoctfile links with -undefined dynamic_lookup)
              mkdir -p src/octstub && echo "" | clang -dynamiclib -x c - -o "$PWD/src/octstub/liboctmex.dylib" -install_name @rpath/liboctmex-stub.dylib
              make -C src oct CC=gcc-12 CXX=g++-12 MEXLINKOPT="-static-libgcc -static-libstdc++ -L$PWD/src/octstub -Wl,-dead_strip_dylibs" USERLINKOPT="-v"
              otool -L zipmat.mex
              if otool -L zipmat.mex | tail -n +2 | grep -E "liboct|/opt/homebrew|/usr/local"; then
                  echo "the mex links a library of the build machine"; exit 1
              fi
          else
              make -C src oct CC=gcc CXX=g++ MEXLINKOPT="-static-libgcc -static-libstdc++ -Wl,-Bstatic -lm -lpthread -Wl,-Bdynamic" USERLINKOPT="-v -s"
              ldd zipmat.mex
          fi
          # no upx on mex files: a packed mex aborts MATLAB/Octave when it raises an error (C++ exceptions can not unwind)
          strip -S zipmat.mex
      - name: Run octave test
        if: ${{ runner.os != 'Linux' }}
        run: |
          octave-cli --version
          if [ "$RUNNER_OS" == "Windows" ]; then
              export PATH="$PWD/octave/octave-10.3.0-w64-64/mingw64/bin":$PATH
          fi
          octave-cli --eval "addpath(pwd);cd test;run_zmat_test;cd ../example;demo_zmat_basic;zmat_speedbench"
      - name: Run octave test
        if: ${{ runner.os == 'Linux' }}
        run: |
          octave-cli --version
          valgrind octave-cli --eval "addpath(pwd);cd test;run_zmat_test;cd ../example;demo_zmat_basic"
          octave-cli --eval "addpath(pwd);cd example;zmat_speedbench"
      - name: Rebuild the Linux release mex for glibc 2.17 (manylinux2014)
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        run: |
          # built on this runner, the mex needs GLIBC_2.34 and does not load on
          # Ubuntu 20.04 or older; the manylinux2014 (CentOS 7) image links it
          # against glibc 2.17 and checks that it does
          docker build -t zmat-linux-release-builder .github/linux_release_builder
          OCTINC=$(dirname "$(dirname "$(find /usr/include -path '*/octave/mex.h' | head -1)")")
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src" \
              -v "$OCTINC:/octinc:ro" -e OCTAVE_INCDIR=/octinc \
              zmat-linux-release-builder bash .github/linux_release_builder/build_zmat.sh
          octave-cli --eval "addpath(pwd);cd test;run_zmat_test"
      - name: Create package folder
        run: |
          mkdir packages
          mkdir zmat
          mkdir -p zmat/octave/${{ env.OCTAVE_ARCH }}
          cp *.{m,txt,rst} zmat/
          cp PKG_ADD* zmat/
          cp INDEX zmat/
          cp DESCRIPTION zmat/
          cp COPYING zmat/
          cp -a example zmat/
          cp -a test zmat/
      - name: Create release tag
        run: perl -e "print 'RELEASE_TAG='. lc('${{ runner.os }}-${{ runner.arch }}-github-latest')" >> $GITHUB_ENV
      - name: Zip zmat
        run: |
          mv zipmat.mex zmat/octave/${{ env.OCTAVE_ARCH }}
          [[ -f libwinpthread-1.dll ]] && mv libwinpthread-1.dll zmat/octave/${{ env.OCTAVE_ARCH }}
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            7z a -tzip packages/zmat-octave-${{ env.RELEASE_TAG }}.zip zmat
          else
            zip -FSr --symlink packages/zmat-octave-${{ env.RELEASE_TAG }}.zip zmat
          fi
      - name: Upload zmat package
        if: ${{ matrix.os == 'ubuntu-22.04' || matrix.os == 'macos-15-intel' || matrix.os == 'macos-14' || matrix.os == 'windows-2022' }}
        uses: actions/upload-artifact@v4
        with:
          name: all-zmat-octave-${{ env.RELEASE_TAG }}
          path: packages/zmat-octave-${{ env.RELEASE_TAG }}.zip

  matlab_test:
    name: MATLAB test
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-15-intel, macos-14, windows-2022]
    defaults:
      run:
        shell: bash

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          submodules: 'recursive'
      - name: Install gcc-12
        if: ${{ runner.os == 'macOS' }}
        run: brew install gcc@12
      - name: Set up MATLAB (non-MacOS14)
        if: ${{ runner.os != 'macOS' }}
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2022a
      - name: Set up MATLAB (MacOS-14)
        if: ${{ runner.os == 'macOS' }}
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2023b
      - name: Build .mltbx package
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        uses: matlab-actions/run-command@v2
        with:
          command: matlab.addons.toolbox.packageToolbox('zmat.prj')
      - name: Upload mltbx artifact
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        uses: actions/upload-artifact@v4
        with:
          name: zmat-mltbx-github-latest
          path: zmat.mltbx
      - name: Install msys2 libraries (Windows only)
        if: ${{ runner.os == 'Windows' }}
        run: |
          # the runner's preinstalled MSYS2, without refreshing its package database:
          # the latest mingw-w64 runtime (gcc 16) does not link with MATLAB's mex
          # (undefined __mingw_fe_dfl_env in libmingwex)
          /c/msys64/usr/bin/pacman -S --noconfirm --needed mingw-w64-x86_64-gcc mingw-w64-x86_64-zlib
          echo 'C:\msys64\mingw64\bin' >> $GITHUB_PATH
      - name: Set up mex gcc (Windows only)
        if: ${{ runner.os == 'Windows' }}
        run: |
          echo 'MW_MINGW64_LOC=C:\msys64\mingw64' >> $GITHUB_ENV
          echo 'COMPFLAGS=""' >> $GITHUB_ENV
      - name: Build MATLAB mex
        run: |
          rm -rf private
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            make -C src mex CC=gcc CXX=g++ MEX="cmd //s //c mex  -f mexopts_msys2_gcc.xml " USERLINKOPT="-v " CXXLIBS="-Lblosc2/lib -L/blosc2/internal-complibs/zstd-1.5.2"
            objdump -p zipmat.mexw* | grep "DLL Name:"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            make -C src mex CC=gcc-12 CXX=g++-12 MEXLINKOPT="-static-libstdc++"
            otool -L zipmat.mex*
          else
            make -C src mex CC=gcc CXX=g++ MEXLINKOPT="-static-libgcc -static-libstdc++ -Wl,-Bstatic -lz -Wl,-Bdynamic" MEX="mex -v"
            ldd zipmat.mex*
          fi
          # no upx on mex files: a packed mex aborts MATLAB/Octave when it raises an error (C++ exceptions can not unwind)
          strip -S zipmat.mex*
      - name: Run MATLAB examples
        uses: matlab-actions/run-command@v2
        with:
          command: addpath(pwd);cd test;run_zmat_test;cd ../example;demo_zmat_basic;zmat_speedbench
      - name: Rebuild the Linux release mex for glibc 2.17 (manylinux2014)
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        run: |
          # built on this runner, the mex needs GLIBC_2.34 and does not load on
          # Ubuntu 20.04 or older; the manylinux2014 (CentOS 7) image links it
          # against glibc 2.17 and checks that it does
          docker build -t zmat-linux-release-builder .github/linux_release_builder
          MLROOT=$(dirname "$(dirname "$(readlink -f "$(which matlab)")")")
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src" \
              -v "$MLROOT:$MLROOT:ro" -e MATLAB_ROOT="$MLROOT" \
              zmat-linux-release-builder bash .github/linux_release_builder/build_zmat.sh
      - name: Run MATLAB tests with the release mex
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        uses: matlab-actions/run-command@v2
        with:
          command: addpath(pwd);cd test;run_zmat_test
      - name: Create package folder
        run: |
          mkdir packages
          mkdir zmat
          mkdir -p zmat/private
          mkdir -p zmat/example
          cp *.{m,txt,rst} zmat/
          cp -a example/*.m zmat/example
          cp -a test zmat/
      - name: Create release tag
        run: perl -e "print 'RELEASE_TAG='. lc('${{ runner.os }}-${{ runner.arch }}-github-latest')" >> $GITHUB_ENV
      - name: Zip zmat
        run: |
          mv zipmat.mex* zmat/private
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            7z a -tzip packages/zmat-matlab-${{ env.RELEASE_TAG }}.zip zmat
          else
            zip -FSr --symlink packages/zmat-matlab-${{ env.RELEASE_TAG }}.zip zmat
          fi
      - name: Upload zmat package
        if: ${{ matrix.os == 'ubuntu-22.04' || matrix.os == 'macos-15-intel' || matrix.os == 'macos-14' || matrix.os == 'windows-2022' }}
        uses: actions/upload-artifact@v4
        with:
          name: all-zmat-matlab-${{ env.RELEASE_TAG }}
          path: packages/zmat-matlab-${{ env.RELEASE_TAG }}.zip

  upload_package:
    name: Upload Packages
    needs: [octave_test, matlab_test]
    runs-on: ubuntu-22.04
    if: ${{ github.repository_owner == 'NeuroJSON' && github.event_name != 'pull_request'}}
    steps:
      - name: Download zmat
        uses: actions/download-artifact@v4
        with:
          pattern: all-zmat*
          merge-multiple: true
          path: packages
      - name: Download mltbx
        uses: actions/download-artifact@v4
        with:
          name: zmat-mltbx-github-latest
          path: packages
      - name: Create all-in-one zmat package
        run: |
          cd packages
          unzip -n 'zmat*.zip'
          rm -rf zmat/example/c/testzmat.exe zmat/example/c/testzmat zmat/example/c/testzmat.dSYM
          tree .
          zip -FSr --symlink zmat-allinone-github-latest.zip zmat
          rm -rf zmat
      - name: Display structure of downloaded files
        run: ls -R packages
      - name: Copy package to server
        if: ${{ github.repository_owner == 'NeuroJSON' && github.event_name != 'pull_request'}}
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.MCX_SERVER }}
          username: ${{ secrets.MCX_SERVER_USER }}
          ssh_private_key: ${{ secrets.MCX_SERVER_SSH_KEY }}
          local_path: "packages/zmat-allinone-github-latest.zip"
          remote_path: ${{ secrets.MCX_CI_PATH }}
      - name: Copy mltbx to server
        if: ${{ github.repository_owner == 'NeuroJSON' && github.event_name != 'pull_request'}}
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.MCX_SERVER }}
          username: ${{ secrets.MCX_SERVER_USER }}
          ssh_private_key: ${{ secrets.MCX_SERVER_SSH_KEY }}
          local_path: "packages/zmat.mltbx"
          remote_path: ${{ secrets.MCX_CI_PATH }}
